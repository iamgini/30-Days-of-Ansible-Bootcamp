---
- name: Learn Magic Variables
  hosts: nodes
  gather_facts: false
  tasks:
    - name: Show Inventory Host Name
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}"
    - name: Show Group
      ansible.builtin.debug:
        msg: "{{ group_names }}"

    - name: Show Host Variable
      ansible.builtin.debug:
        msg: "{{ hostvars }}"
